name: Bootstrap OrderYourself
on:
  push:
    branches: [main]
    paths: ['.bootstrap/**']
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and extract source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/OrderYourself-source.tar.xz
          echo "72fb32d8df404525ae6f661b67626380a2429511c5c2157d1604c700065c68d5  /tmp/OrderYourself-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/OrderYourself-source.tar.xz -C .
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import OrderYourself project source'
          git push
