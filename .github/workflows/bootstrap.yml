name: Bootstrap OrderYourself
on:
  push:
    branches: [main]
    paths: ['.bootstrap/READY']
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.event.head_commit.message != 'Import OrderYourself project source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and extract source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 --decode > /tmp/OrderYourself-source.tar.xz
          echo "b1f611aa7f85261d25db3b4f6d21651234000f483e11676f49f9704ecde06a33  /tmp/OrderYourself-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/OrderYourself-source.tar.xz -C .
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import OrderYourself project source'
          git push
