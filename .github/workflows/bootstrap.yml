name: Bootstrap OrderYourself
on:
  push:
    branches: [main]
    paths: ['.bootstrap/**']
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and extract source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 --decode > /tmp/OrderYourself-source.tar.xz
          echo "7009f6cb5f58d605112ca7c910ff8e4978cfdc98bd263e90db9ae35566450ad1  /tmp/OrderYourself-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/OrderYourself-source.tar.xz -C .
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import OrderYourself project source'
          git push
