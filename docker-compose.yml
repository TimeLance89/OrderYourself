services:
  orderyourself:
    build: .
    environment:
      DATABASE_PATH: /app/data/order_yourself.db
      TZ: Europe/Berlin
    ports:
      - "${ORDERYOURSELF_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
